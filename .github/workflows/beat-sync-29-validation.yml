name: Beat Sync issue 29 validation (temporary)

on:
  push:
    branches:
      - codex/beat-sync-cache-issue-29

permissions:
  contents: write

jobs:
  test-beat-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Linux audio development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format new Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/music.rs tests/beat_sync_cache.rs
          if ! git diff --quiet -- src/music.rs tests/beat_sync_cache.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/music.rs tests/beat_sync_cache.rs
            git commit -m 'style(music): apply rustfmt to beat cache slice'
            git push origin HEAD:codex/beat-sync-cache-issue-29
          fi
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run beat cache acceptance fixtures
        run: cargo test --locked --offline --test beat_sync_cache
      - name: Run strict Clippy for library and tests
        run: cargo clippy --locked --offline --all-targets -- -D warnings
